services:
  loxhuebridge:
    # WICHTIG: Hier steht jetzt der neue, offizielle Image-Name
    image: ghcr.io/bausi2k/loxone-hue-bridge:latest
    
    container_name: loxhuebridge
    restart: always
    
    # WICHTIG für Loxone UDP Kommunikation
    network_mode: "host"
    
    environment:
      - TZ=Europe/Vienna
      
    volumes:
      # Nur noch der Data-Ordner ist wichtig
      - ./data:/app/data

    # Optional: Begrenzt die Docker-Logdatei auf Linux-Servern und Raspberry Pi,
    # sonst wächst sie im Dauerbetrieb unbegrenzt - unabhängig von der Rotation
    # der logs.db. NICHT auf einer Synology verwenden: Mit dem Treiber
    # "json-file" zeigt der Container Manager keine Logs mehr an.
    # logging:
    #   driver: "json-file"
    #   options:
    #     max-size: "10m"
    #     max-file: "3"
